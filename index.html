<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Supabase Auth & Profil</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row g-4 justify-content-center" id="logForms">

      <!-- Inscription -->
      <div class="col-md-4">
        <div class="card shadow-lg p-4 rounded-4">
          <h2 class="text-center mb-4">Créer un compte</h2>
          <form id="signup-form">
            <div class="mb-3">
              <label for="signup-email" class="form-label">Adresse email</label>
              <input type="email" class="form-control" id="signup-email" placeholder="exemple@email.com" required>
            </div>
            <div class="mb-3">
              <label for="signup-password" class="form-label">Mot de passe</label>
              <input type="password" class="form-control" id="signup-password" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">S’inscrire</button>
          </form>
          <div id="signup-message" class="mt-3 text-center small"></div>
        </div>
      </div>

      <!-- Connexion -->
      <div class="col-md-4">
        <div class="card shadow-lg p-4 rounded-4">
          <h2 class="text-center mb-4">Connexion</h2>
          <form id="signin-form">
            <div class="mb-3">
              <label for="signin-email" class="form-label">Adresse email</label>
              <input type="email" class="form-control" id="signin-email" placeholder="exemple@email.com" required>
            </div>
            <div class="mb-3">
              <label for="signin-password" class="form-label">Mot de passe</label>
              <input type="password" class="form-control" id="signin-password" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Se connecter</button>
          </form>
          <div id="signin-message" class="mt-3 text-center small"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bloc d'informations et modification du profil -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12">
        <div id="user-profile-box" class="card shadow-lg p-4 rounded-4 d-none">
          <h2 class="text-center mb-4 text-success">Connecté</h2>
          <p class="text-center"><strong>Email :</strong> <span id="user-email"></span></p>

          <!-- Formulaire de modification de l'email -->
          <form id="update-email-form" class="mb-4">
            <h5 class="mb-3">Modifier l'adresse email</h5>
            <div class="mb-3">
              <label for="new-email" class="form-label">Nouvel email</label>
              <input type="email" class="form-control" id="new-email" placeholder="nouvel@email.com" required>
            </div>
            <button type="submit" class="btn btn-warning w-100">Mettre à jour l'email</button>
          </form>

          <!-- Formulaire de modification du profil -->
          <form id="profile-form">
            <h5 class="mb-3">Informations du profil</h5>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="first-name" class="form-label">Prénom</label>
                <input type="text" class="form-control" id="first-name" required>
              </div>
              <div class="col-md-6">
                <label for="last-name" class="form-label">Nom</label>
                <input type="text" class="form-control" id="last-name" required>
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label">Téléphone</label>
                <input type="tel" class="form-control" id="phone">
              </div>
              <div class="col-md-6">
                <label for="address" class="form-label">Adresse</label>
                <input type="text" class="form-control" id="address">
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Enregistrer le profil</button>
          </form>

          <!-- Bouton de déconnexion -->
          <button id="logout-btn" class="btn btn-outline-danger w-100 mt-4">Se déconnecter</button>

          <!-- Message utilisateur -->
          <div id="user-message" class="mt-3 text-center small text-muted"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Supabase + Script logique -->
  <script type="module" src="script.js"></script>
</body>
</html>
