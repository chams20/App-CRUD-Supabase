<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription & Connexion - Supabase</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="row gap-4">
        <!-- Formulaire d'inscription -->
        <div class="card shadow-lg p-4 rounded-4" style="width: 380px;">
            <h2 class="text-center mb-4">Créer un compte</h2>
            <form id="signup-form">
            <div class="mb-3">
                <label for="signup-email" class="form-label">Adresse email</label>
                <input type="email" class="form-control" id="signup-email" placeholder="exemple@email.com" required>
            </div>
            <div class="mb-3">
                <label for="signup-password" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="signup-password" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">S’inscrire</button>
            </form>
            <div id="signup-message" class="mt-3 text-center small"></div>
        </div>

        <!-- Formulaire de connexion -->
        <div class="card shadow-lg p-4 rounded-4" style="width: 380px;">
            <h2 class="text-center mb-4">Se connecter</h2>
            <form id="signin-form">
            <div class="mb-3">
                <label for="signin-email" class="form-label">Adresse email</label>
                <input type="email" class="form-control" id="signin-email" placeholder="exemple@email.com" required>
            </div>
            <div class="mb-3">
                <label for="signin-password" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="signin-password" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Se connecter</button>
            </form>
            <div id="signin-message" class="mt-3 text-center small"></div>
        </div>

        <!-- Boîte d'informations utilisateur -->
        <div id="user-box" class="card shadow-lg p-4 rounded-4 d-none info-user">
            <h2 class="text-center mb-4">Je suis connecté</h2>
            <p><strong>Email :</strong> <span id="user-email"></span></p>

            <form id="update-form" class="mt-3">
                <div class="mb-3">
                <label for="new-email" class="form-label">Modifier l'email</label>
                <input type="email" class="form-control" id="new-email" placeholder="nouvel@email.com" required>
                </div>
                <button type="submit" class="btn btn-warning w-100">Mettre à jour</button>
            </form>

            <button id="logout-btn" class="btn btn-outline-danger w-100 mt-3">Se déconnecter</button>
            <div id="user-message" class="mt-3 text-center small"></div>
        </div>
    </div>
    

  <!-- JS Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script logique (qui importe aussi importSupabase.js) -->
  <script type="module" src="script.js"></script>
</body>
</html>
